<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flow | Brutalist Portal</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="landing-body">
    <main class="landing-shell">
      <section class="landing-hero">
        <p class="eyebrow">Agent orchestration in concrete form</p>
        <h1>FLOW</h1>
        <p>
          A local-first control plane for coordinating nested LLM agents, validating goals,
          and turning chats into structured markdown with LaTeX.
        </p>
        <div class="landing-actions">
          <a href="/portal" class="landing-button">Enter Portal</a>
          <a href="/api/index" class="landing-link">Inspect API index</a>
        </div>
      </section>

      <section class="landing-gallery" aria-label="Brutalist architecture studies">
        <figure class="hero-image hero-image-a">
          <img src="/images/unsplash/arturo-castaneyra-o-dkYSvidB4-unsplash.jpg" alt="Brutalist structure with deep geometric shadows" />
        </figure>
        <figure class="hero-image hero-image-b">
          <img src="/images/unsplash/marek-pavlik-bWXMh1a9rVw-unsplash.jpg" alt="Massive concrete architecture shot from low angle" />
        </figure>
        <figure class="hero-image hero-image-c">
          <img src="/images/unsplash/uve-sanchez-9DRX_cW48RQ-unsplash.jpg" alt="Monolithic building facade with rigid symmetry" />
        </figure>
      </section>
    </main>
  </body>
</html>
